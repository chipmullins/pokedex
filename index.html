<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="outerCard">
      <h1>Pokedex</h1>
      <p>Search by name or number<br><br></p>
      <form id="searchForm">
            <label for="searchBox" id="searchLabel">Pokémon name or number</label>
            <div class="pokeSearch">
              <input type="text" id="searchBox" name="searchBox">
              <button type="submit" id="searchButton" name="searchButton">Search</button>
            </div>
            
        </form>
        <div id="messageCard">
          <p id="errMessage"></p>
        </div>

        <div id="pokeResult">
        </div>       
    </div>
    

  <script src="app.js"></script>
</body>
</html>
